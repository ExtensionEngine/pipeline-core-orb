description: >
  Install the Infisical CLI (https://github.com/Infisical/cli), a command-line tool for
  secret management. The command verifies the selected release archive against its
  published SHA-256 checksum and fails unless the requested version is available on PATH
  after installation.

parameters:
  version:
    type: string
    default: ""
    description: >
      Choose a specific Infisical CLI semantic version from https://github.com/Infisical/cli/releases.
      Provided versions may include a leading v. By default, the latest version is picked.

steps:
  - run:
      name: Install Infisical CLI
      environment:
        PARAM_STR_VERSION: <<parameters.version>>
      command: <<include(scripts/install-infisical.sh)>>
