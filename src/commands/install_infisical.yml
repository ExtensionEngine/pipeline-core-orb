description: >
  Install Infisical CLI (https://github.com/Infisical/cli) a powerful command-line tool
  for secret management, optionally selecting the specific version.

parameters:
  version:
    type: string
    default: ""
    description: >
      Choose the specific version of Infisical CLI from https://github.com/Infisical/cli/releases.
      By default, the latest version if picked.

steps:
  - run:
      name: Install Infisical CLI
      environment:
        PARAM_STR_VERSION: <<parameters.version>>
      command: <<include(scripts/install-infisical.sh)>>
