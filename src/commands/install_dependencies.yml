description: >
  Install dependencies with manager-specific caching using an already available package manager.
  Requires execution environment with Node.js >= 18.20 pre-installed.

parameters:
  pkg_manager:
    type: string
    default: ""
    description: |
      Choose Node.js package manager to use. Supports npm and pnpm.
      The package manager may follow the format <name>[@<version|tag>], but install execution uses only the name.
      When omitted, the DEFAULT_PKG_MANAGER environment variable is used at runtime.
      Dependency cache restore/save behavior is based on the resolved package manager name and major version.
      This command does not install or update package managers; use ensure_pkg_manager before this command when needed.
  pkg_json_dir:
    type: string
    default: "."
    description: >
      Path to the directory containing package.json file.
      Not needed when package.json is in the root.
  install_command:
    type: string
    default: ""
    description: |
      Custom shell command to install dependencies. Useful when default commands,
      "npm ci" or "pnpm i --frozen-lockfile", are unsuitable.
      A package manager matching lockfile is still required and is processed before
      dependency installation so cache keys remain lockfile-based.
      The command is executed with Bash and should not include secrets in arguments,
      because command arguments may be visible in CI logs and process metadata.
  cache_version:
    type: string
    default: "v1"
    description: Change the default cache version if the cache needs to be cleared for some reason.
  cache_path:
    type: string
    default: ~/.cache/pipeline-core-orb/dependency-cache
    description: |
      Exact directory restored and saved for the selected package manager's dependency cache or store.
      Supports absolute paths and current-user home paths beginning with ~/; paths are canonicalized
      before use and must not resolve to the filesystem root or current user's home directory. It is
      used only during this dependency installation and is not persisted in package-manager configuration.
      Jobs that install with both npm and pnpm must provide separate cache_path values for each manager.

steps:
  - run:
      name: Check Node.js version
      command: <<include(scripts/check-node-version.sh)>>
  - run:
      name: Resolve package manager
      environment:
        PARAM_STR_PKG_MANAGER: <<parameters.pkg_manager>>
      command: <<include(scripts/export-pkg-manager.sh)>>
  - run:
      name: Validate package manager
      command: <<include(scripts/validate-pkg-manager.sh)>>
  - run:
      name: Check for package.json
      working_directory: <<parameters.pkg_json_dir>>
      command: <<include(scripts/check-pkg-json.sh)>>
  - run:
      name: Write Node.js version cache metadata
      command: <<include(scripts/write-node-version-cache-metadata.sh)>>
  - run:
      name: Write package manager cache metadata
      command: <<include(scripts/write-pkg-manager-cache-metadata.sh)>>
  - run:
      name: Process lockfile
      working_directory: <<parameters.pkg_json_dir>>
      command: <<include(scripts/process-lockfile.sh)>>
  - run:
      name: Resolve dependency cache path
      environment:
        PARAM_STR_CACHE_PATH: <<parameters.cache_path>>
      command: <<include(scripts/resolve-dependency-cache-path.sh)>>
  - restore_cache:
      keys:
        - node-{{ arch }}-<<parameters.cache_version>>-{{ checksum "/tmp/node-version" }}-{{ checksum "/tmp/node-pkg-manager" }}-{{ checksum "/tmp/node-cache-path" }}-{{ checksum "/tmp/node-lockfile" }}
        - node-{{ arch }}-<<parameters.cache_version>>-{{ checksum "/tmp/node-version" }}-{{ checksum "/tmp/node-pkg-manager" }}-{{ checksum "/tmp/node-cache-path" }}-
  - run:
      name: Install dependencies
      working_directory: <<parameters.pkg_json_dir>>
      environment:
        PARAM_STR_CACHE_PATH: <<parameters.cache_path>>
        PARAM_STR_INSTALL_COMMAND: <<parameters.install_command>>
      command: <<include(scripts/install-dependencies.sh)>>
  - run:
      name: Revalidate dependency cache path
      environment:
        PARAM_STR_CACHE_PATH: <<parameters.cache_path>>
      command: <<include(scripts/resolve-dependency-cache-path.sh)>>
  - save_cache:
      key: node-{{ arch }}-<<parameters.cache_version>>-{{ checksum "/tmp/node-version" }}-{{ checksum "/tmp/node-pkg-manager" }}-{{ checksum "/tmp/node-cache-path" }}-{{ checksum "/tmp/node-lockfile" }}
      paths:
        - <<parameters.cache_path>>
  - run:
      name: Remove temporary dependency metadata
      command: <<include(scripts/remove-dependency-cache-metadata.sh)>>
