version: 2.1

orbs:
  orb-tools: circleci/orb-tools@12.0
  node: circleci/node@7.1.0
  core: {}

filters: &filters
  tags:
    only: /.*/

release-filters: &release-filters
  branches:
    ignore: /.*/
  tags:
    only: /^v[0-9]+\.[0-9]+\.[0-9]+$/

jobs:
  ensure-npm-version:
    executor: core/node
    steps:
      - core/ensure_pkg_manager:
          pkg_manager: npm@10.5.1
      - run:
          name: Validate version
          command: |
            if [ "$(npm --version)" != "10.5.1" ]; then
              echo "npm version 10.5.1 not found"
              exit 1
            fi
  ensure-npm-latest-compatibility:
    executor: core/node
    steps:
      - core/ensure_pkg_manager:
          pkg_manager: npm@latest
      - run:
          name: Validate latest version compatibility
          command: |
            NPM_LATEST_VERSION=$(npm view npm version)
            if ! npm --version | grep -q "$NPM_LATEST_VERSION"; then
              echo "npm version $NPM_LATEST_VERSION not found"
              exit 1
            fi
  ensure-pnpm-version:
    executor: core/node_secrets
    steps:
      - core/ensure_pkg_manager:
          pkg_manager: pnpm@10.5.1
      - run:
          name: Validate version
          command: |
            if [ "$(pnpm --version)" != "10.5.1" ]; then
              echo "pnpm version 10.5.1 not found"
              exit 1
            fi
  ensure-pnpm-latest-compatibility:
    executor: core/node_secrets
    steps:
      - core/ensure_pkg_manager:
          pkg_manager: pnpm@latest
      - run:
          name: Validate latest version compatibility
          command: |
            PNPM_LATEST_VERSION=$(npm view pnpm version)
            if ! pnpm --version | grep -q "$PNPM_LATEST_VERSION"; then
              echo "pnpm version $PNPM_LATEST_VERSION not found"
              exit 1
            fi
  ensure-pnpm-fresh-install:
    docker:
      - image: node:lts-slim
    resource_class: medium
    steps:
      - core/ensure_pkg_manager:
          pkg_manager: pnpm
      - run:
          name: Validate version
          command: |
            PNPM_LATEST_VERSION=$(npm view pnpm version)
            if ! pnpm --version | grep -q "$PNPM_LATEST_VERSION"; then
              echo "pnpm version $PNPM_LATEST_VERSION not found"
              exit 1
            fi
  ensure-pnpm-removes-existing-installation:
    executor: core/node
    steps:
      - run:
          name: Prepare standalone pnpm path shadow
          command: |
            export PNPM_HOME="${HOME}/.pnpm-home-shadow"
            mkdir -p "${PNPM_HOME}" "${HOME}/.pnpm-store-shadow"
            printf 'store sentinel\n' > "${HOME}/.pnpm-store-shadow/sentinel"
            {
              printf '%s\n' '#!/bin/sh'
              printf '%s\n' 'if [ "$1" = "--version" ]; then'
              printf '%s\n' "  printf '9.0.0\\n'"
              printf '%s\n' '  exit 0'
              printf '%s\n' 'fi'
              printf '%s\n' 'if [ "$1" = "store" ] && [ "$2" = "path" ]; then'
              printf '%s\n' '  printf "%s\\n" "${HOME}/.pnpm-store-shadow"'
              printf '%s\n' '  exit 0'
              printf '%s\n' 'fi'
              printf '%s\n' 'printf "Unexpected standalone pnpm invocation: %s\\n" "$*" >&2'
              printf '%s\n' 'exit 1'
            } > "${PNPM_HOME}/pnpm"
            chmod +x "${PNPM_HOME}/pnpm"
            {
              printf 'export PNPM_HOME=%q\n' "${PNPM_HOME}"
              printf 'export PATH=%q:"$PATH"\n' "${PNPM_HOME}"
            } >> "${BASH_ENV}"
      - core/ensure_pkg_manager:
          pkg_manager: pnpm@10.5.1
      - run:
          name: Validate pnpm replacement removes existing installation
          command: |
            EXPECTED_PNPM="$(npm prefix -g)/bin/pnpm"
            if [ "$(command -v pnpm)" != "${EXPECTED_PNPM}" ]; then
              echo "Expected npm-installed pnpm to take precedence"
              echo "Expected: ${EXPECTED_PNPM}"
              echo "Actual: $(command -v pnpm)"
              exit 1
            fi
            if [ "$(pnpm --version)" != "10.5.1" ]; then
              echo "Expected npm-installed pnpm version 10.5.1"
              exit 1
            fi
            if [ -e "${PNPM_HOME}" ]; then
              echo "Expected existing PNPM_HOME to be removed"
              exit 1
            fi
            if [ -e "${HOME}/.pnpm-store-shadow" ]; then
              echo "Expected existing pnpm store to be removed"
              exit 1
            fi
  ensure-pnpm-machine-install:
    machine:
      image: ubuntu-2404:current
    steps:
      - node/install
      - core/ensure_pkg_manager:
          pkg_manager: pnpm
      - run:
          name: Validate version
          command: |
            PNPM_LATEST_VERSION=$(npm view pnpm version)
            if ! pnpm --version | grep -q "$PNPM_LATEST_VERSION"; then
              echo "pnpm version $PNPM_LATEST_VERSION not found"
              exit 1
            fi
  ensure-default-pkg-manager-env:
    executor: core/node
    environment:
      DEFAULT_PKG_MANAGER: pnpm@10.5.1
    steps:
      - core/ensure_pkg_manager
      - run:
          name: Validate version and metadata ownership
          command: |
            if [ "$(pnpm --version)" != "10.5.1" ]; then
              echo "pnpm version 10.5.1 not found"
              exit 1
            fi
            if [ -e /tmp/node-cache-metadata ]; then
              echo "ensure_pkg_manager should not create dependency cache metadata"
              exit 1
            fi

  install-dependencies-npm-node-18:
    executor:
      name: core/node_secrets
      tag: "18"
    steps:
      - checkout
      - core/ensure_pkg_manager:
          pkg_manager: npm
      - core/install_dependencies:
          pkg_manager: npm
          pkg_json_dir: ~/project/sample
          cache_version: node18_v8
          cache_path: ~/project/.orb-npm-cache
      - run:
          name: Validate npm direct dependency cache
          command: |
            NPM_CACHE_DIR="$HOME/project/.orb-npm-cache"
            if [ ! -d "$NPM_CACHE_DIR/_cacache" ]; then
              echo "Expected npm direct dependency cache to be populated"
              exit 1
            fi
            if [ -e /tmp/node-cache-metadata ] || [ -e /tmp/node-lockfile ]; then
              echo "Expected temporary dependency cache files to be removed"
              exit 1
            fi
      - run: cd ~/project/sample && npm run build
  install-dependencies-pnpm-node-18:
    executor:
      name: core/node
      tag: "18.20"
    steps:
      - checkout
      - core/ensure_pkg_manager:
          pkg_manager: pnpm@10.5.1
      - core/install_dependencies:
          pkg_manager: pnpm
          pkg_json_dir: ~/project/sample
          cache_version: node18_v8
          cache_path: ~/project/.orb-pnpm-store
      - run:
          name: Validate pnpm direct dependency cache
          command: |
            PNPM_STORE_DIR="$HOME/project/.orb-pnpm-store/v$(pnpm --version | cut -d. -f1)"
            if [ ! -d "$PNPM_STORE_DIR" ]; then
              echo "Expected pnpm direct dependency cache to be populated"
              exit 1
            fi
            if [ -e /tmp/node-cache-metadata ] || [ -e /tmp/node-lockfile ]; then
              echo "Expected temporary dependency cache files to be removed"
              exit 1
            fi
      - run: cd ~/project/sample && pnpm run build
  install-dependencies-custom-command:
    executor: core/node
    steps:
      - checkout
      - core/ensure_pkg_manager:
          pkg_manager: pnpm@10.5.1
      - core/install_dependencies:
          pkg_manager: pnpm
          pkg_json_dir: ~/project/sample
          install_command: pnpm install | tee /tmp/pnpm-custom-install.log
          cache_version: v10
      - run:
          name: Validate custom install command output
          command: |
            if [ ! -s /tmp/pnpm-custom-install.log ]; then
              echo "Expected custom install pipeline output to be captured"
              exit 1
            fi
      - run: cd ~/project/sample && pnpm run build
  install-dependencies-default-pkg-manager-env:
    executor: core/node
    environment:
      DEFAULT_PKG_MANAGER: pnpm@10.5.1
    steps:
      - checkout
      - core/ensure_pkg_manager
      - core/install_dependencies:
          pkg_json_dir: ~/project/sample
          cache_version: default_env_v1
      - run:
          name: Validate default package manager direct dependency cache
          command: |
            PNPM_STORE_DIR="$HOME/.cache/pipeline-core-orb/dependency-cache/v$(pnpm --version | cut -d. -f1)"
            if [ ! -d "$PNPM_STORE_DIR" ]; then
              echo "Expected pnpm direct dependency cache to be populated"
              exit 1
            fi
            if [ -e /tmp/node-cache-metadata ] || [ -e /tmp/node-lockfile ]; then
              echo "Expected temporary dependency cache files to be removed"
              exit 1
            fi
      - run: cd ~/project/sample && pnpm run build
  install-dependencies-preinstalled-npm:
    executor: core/node
    steps:
      - checkout
      - core/install_dependencies:
          pkg_manager: npm
          pkg_json_dir: ~/project/sample
          cache_version: external_preinstalled_npm_v1
      - run: cd ~/project/sample && npm run build
  install-dependencies-externally-installed-pnpm:
    executor: core/node
    steps:
      - checkout
      - run:
          name: Install pnpm externally
          command: sudo npm install -g pnpm@10.5.1
      - core/install_dependencies:
          pkg_manager: pnpm
          pkg_json_dir: ~/project/sample
          cache_version: external_installed_pnpm_v1
      - run: cd ~/project/sample && pnpm run build

  run-script-npm:
    executor: core/node
    steps:
      - checkout
      - core/ensure_pkg_manager:
          pkg_manager: npm
      - core/install_dependencies:
          pkg_manager: npm
          pkg_json_dir: ~/project/sample
      - core/run_script:
          pkg_manager: npm
          pkg_json_dir: ~/project/sample
          script: test
          script_args: --json --outputFile=results_npm.json
      - run:
          name: Print output file
          working_directory: ~/project/sample
          command: cat results_npm.json
  run-script-pnpm:
    executor: core/node
    steps:
      - checkout
      - core/ensure_pkg_manager:
          pkg_manager: pnpm@10.5.1
      - core/install_dependencies:
          pkg_manager: pnpm
          pkg_json_dir: ~/project/sample
      - core/run_script:
          pkg_manager: pnpm
          pkg_json_dir: ~/project/sample
          script: test
          script_args: --json --outputFile=results_pnpm.json
      - run:
          name: Print output file
          working_directory: ~/project/sample
          command: cat results_pnpm.json
  run-script-pnpm-latest-10-compatibility:
    executor: core/node
    steps:
      - checkout
      - core/ensure_pkg_manager:
          pkg_manager: pnpm@latest-10
      - core/install_dependencies:
          pkg_manager: pnpm
          pkg_json_dir: ~/project/sample
      - core/run_script:
          pkg_manager: pnpm
          pkg_json_dir: ~/project/sample
          script: test
          script_args: --json --outputFile=results_pnpm_latest_10.json
      - run:
          name: Print output file
          working_directory: ~/project/sample
          command: cat results_pnpm_latest_10.json
  run-script-default-pkg-manager-env:
    executor: core/node
    environment:
      DEFAULT_PKG_MANAGER: pnpm@10.5.1
    steps:
      - checkout
      - core/ensure_pkg_manager
      - core/install_dependencies:
          pkg_json_dir: ~/project/sample
      - core/run_script:
          pkg_json_dir: ~/project/sample
          script: test
          script_args: --json --outputFile=results_pnpm_default.json
      - run:
          name: Validate run_script metadata ownership
          command: |
            if [ -e /tmp/node-cache-metadata ]; then
              echo "run_script should not create dependency cache metadata"
              exit 1
            fi
      - run:
          name: Print output file
          working_directory: ~/project/sample
          command: cat results_pnpm_default.json
  run-script-externally-prepared-pnpm:
    executor: core/node
    steps:
      - checkout
      - run:
          name: Install pnpm externally
          command: sudo npm install -g pnpm@10.5.1
      - run:
          name: Install dependencies externally
          command: pnpm install --frozen-lockfile
          working_directory: ~/project/sample
      - core/run_script:
          pkg_manager: pnpm
          pkg_json_dir: ~/project/sample
          script: test
          script_args: --json --outputFile=results_external_pnpm.json
      - run:
          name: Print output file
          working_directory: ~/project/sample
          command: cat results_external_pnpm.json
  run-script-npm-workspace:
    executor: core/node
    steps:
      - checkout
      - core/run_script:
          pkg_manager: npm
          pkg_json_dir: ~/project/sample/workspace
          script: workspace-test
          script_args: workspace-result-npm.txt npm workspace
          run_options: --workspace=workspace-app
      - run:
          name: Validate npm workspace script output
          working_directory: ~/project/sample/workspace/packages/app
          command: |
            if [ "$(cat workspace-result-npm.txt)" != "npm|workspace" ]; then
              echo "Unexpected npm workspace script output"
              exit 1
            fi
      - run:
          name: Clean npm workspace script output
          working_directory: ~/project/sample/workspace/packages/app
          command: rm -f workspace-result-npm.txt
  run-script-pnpm-workspace:
    executor: core/node
    steps:
      - checkout
      - core/ensure_pkg_manager:
          pkg_manager: pnpm@10.5.1
      - core/run_script:
          pkg_manager: pnpm
          pkg_json_dir: ~/project/sample/workspace
          script: workspace-test
          script_args: workspace-result-pnpm.txt pnpm workspace
          run_options: --filter=workspace-app
      - run:
          name: Validate pnpm workspace script output
          working_directory: ~/project/sample/workspace/packages/app
          command: |
            if [ "$(cat workspace-result-pnpm.txt)" != "pnpm|workspace" ]; then
              echo "Unexpected pnpm workspace script output"
              exit 1
            fi
      - run:
          name: Clean pnpm workspace script output
          working_directory: ~/project/sample/workspace/packages/app
          command: rm -f workspace-result-pnpm.txt
  install-infisical:
    executor: core/ubuntu
    steps:
      - core/install_infisical
      - run:
          name: Validate Infisical CLI installation
          command: |
            if ! infisical --version | grep -Eq 'v?[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "Infisical CLI did not report a semantic version"
              exit 1
            fi
      - core/install_infisical:
          version: v0.43.119
      - run:
          name: Validate pinned Infisical CLI installation
          command: |
            if ! infisical --version | grep -Eq 'v?0\.43\.119'; then
              echo "Infisical CLI version 0.43.119 not found"
              infisical --version
              exit 1
            fi
  negative-path-validation:
    executor: core/node
    steps:
      - checkout
      - run:
          name: Validate expected failure paths
          command: |
            assert_status() {
              local expected_status="$1"
              local expected_output="$2"
              local output
              local status

              shift 2

              set +e
              output=$("$@" 2>&1)
              status=$?
              set -e

              if [ "${status}" -ne "${expected_status}" ]; then
                echo "Expected status ${expected_status}, got ${status}: $*"
                echo "Output:"
                printf '%s\n' "${output}"
                exit 1
              fi

              if ! printf '%s\n' "${output}" | grep -Fq "${expected_output}"; then
                echo "Expected output to contain: ${expected_output}"
                echo "Actual output:"
                printf '%s\n' "${output}"
                exit 1
              fi
            }

            TEMP_DIR=$(mktemp -d)
            BASH_ENV_FILE="${TEMP_DIR}/bash_env"
            trap 'rm -rf "${TEMP_DIR}" /tmp/node-cache-metadata /tmp/node-lockfile' EXIT

            mkdir -p "${TEMP_DIR}/missing-package-json"
            mkdir -p "${TEMP_DIR}/missing-lockfile"
            mkdir -p "${TEMP_DIR}/failing-script"
            mkdir -p "${TEMP_DIR}/cache-project"
            mkdir -p "${TEMP_DIR}/dependency-cache"
            mkdir -p "${TEMP_DIR}/other-cache"
            mkdir -p "${TEMP_DIR}/safe-cache"
            ln -s "${HOME}" "${TEMP_DIR}/home-cache-link"

            printf '{"scripts":{}}\n' > "${TEMP_DIR}/missing-lockfile/package.json"
            printf '{"scripts":{"fail":"exit 42"}}\n' > "${TEMP_DIR}/failing-script/package.json"
            printf '{"lockfileVersion":3}\n' > "${TEMP_DIR}/cache-project/package-lock.json"

            rm -rf "${HOME}/cache-path-alias"
            rm -f /tmp/node-cache-metadata /tmp/node-lockfile
            assert_status 1 "cache_path must not resolve to the filesystem root or the current user's home directory." \
              env BASH_ENV="${BASH_ENV_FILE}" PARAM_ENUM_CACHE_PATH_MODE=initialize PARAM_STR_CACHE_PATH="${HOME}/cache-path-alias/.." \
              bash src/scripts/resolve-dependency-cache-path.sh
            if [ -e /tmp/node-cache-metadata ]; then
              echo "Unsafe home alias must not produce dependency cache metadata"
              exit 1
            fi

            assert_status 1 "cache_path must not resolve to the filesystem root or the current user's home directory." \
              env BASH_ENV="${BASH_ENV_FILE}" PARAM_ENUM_CACHE_PATH_MODE=initialize PARAM_STR_CACHE_PATH=/tmp/../ \
              bash src/scripts/resolve-dependency-cache-path.sh
            if [ -e /tmp/node-cache-metadata ]; then
              echo "Unsafe root alias must not produce dependency cache metadata"
              exit 1
            fi

            assert_status 1 "cache_path must not resolve to the filesystem root or the current user's home directory." \
              env BASH_ENV="${BASH_ENV_FILE}" PARAM_ENUM_CACHE_PATH_MODE=initialize PARAM_STR_CACHE_PATH="${TEMP_DIR}/home-cache-link" \
              bash src/scripts/resolve-dependency-cache-path.sh
            if [ -e /tmp/node-cache-metadata ]; then
              echo "Unsafe symbolic-link path must not produce dependency cache metadata"
              exit 1
            fi

            bash src/scripts/write-node-version-cache-metadata.sh
            CURRENT_PKG_MANAGER=npm bash src/scripts/write-pkg-manager-cache-metadata.sh
            bash -c 'cd "$1" && CURRENT_PKG_MANAGER=npm bash "$2"' _ \
              "${TEMP_DIR}/cache-project" \
              "${PWD}/src/scripts/process-lockfile.sh"

            SAFE_ABSOLUTE_CACHE_PATH=$(cd "${TEMP_DIR}/safe-cache" && pwd -P)
            : > "${BASH_ENV_FILE}"
            env BASH_ENV="${BASH_ENV_FILE}" PARAM_ENUM_CACHE_PATH_MODE=initialize PARAM_STR_CACHE_PATH="${TEMP_DIR}/safe-cache" \
              bash src/scripts/resolve-dependency-cache-path.sh
            source "${BASH_ENV_FILE}"
            if [ "${RESOLVED_DEPENDENCY_CACHE_PATH}" != "${SAFE_ABSOLUTE_CACHE_PATH}" ]; then
              echo "Expected absolute dependency cache path export to be canonical"
              exit 1
            fi
            NODE_MAJOR=$(node -p 'process.versions.node.split(".")[0]')
            NPM_MAJOR=$(npm --version | cut -d. -f1)
            EXPECTED_METADATA=$(printf 'node-major=%s\npackage-manager=npm@%s\ncache-path=%s\n' "${NODE_MAJOR}" "${NPM_MAJOR}" "${SAFE_ABSOLUTE_CACHE_PATH}")
            if [ "$(cat /tmp/node-cache-metadata)" != "${EXPECTED_METADATA}" ]; then
              echo "Expected merged cache metadata to contain deterministic Node.js, package manager, and cache path records"
              exit 1
            fi
            if [ "$(cat /tmp/node-lockfile)" != "$(cat "${TEMP_DIR}/cache-project/package-lock.json")" ]; then
              echo "Expected lockfile cache input to remain separate"
              exit 1
            fi
            METADATA_SUM=$(shasum -a 256 /tmp/node-cache-metadata)
            METADATA_SUM=${METADATA_SUM%% *}
            env RESOLVED_DEPENDENCY_CACHE_PATH="${RESOLVED_DEPENDENCY_CACHE_PATH}" PARAM_ENUM_CACHE_PATH_MODE=verify PARAM_STR_CACHE_PATH="${TEMP_DIR}/safe-cache" \
              bash src/scripts/resolve-dependency-cache-path.sh
            if [ "$(shasum -a 256 /tmp/node-cache-metadata | cut -d' ' -f1)" != "${METADATA_SUM}" ]; then
              echo "Cache metadata changed during path verification"
              exit 1
            fi

            SAFE_HOME_CACHE_PATH="$HOME/.cache/pipeline-core-orb-negative-path-cache"
            bash src/scripts/write-node-version-cache-metadata.sh
            CURRENT_PKG_MANAGER=npm bash src/scripts/write-pkg-manager-cache-metadata.sh
            : > "${BASH_ENV_FILE}"
            env BASH_ENV="${BASH_ENV_FILE}" PARAM_ENUM_CACHE_PATH_MODE=initialize PARAM_STR_CACHE_PATH='~/.cache/pipeline-core-orb-negative-path-cache' \
              bash src/scripts/resolve-dependency-cache-path.sh
            source "${BASH_ENV_FILE}"
            SAFE_HOME_CACHE_PATH=$(cd "${SAFE_HOME_CACHE_PATH}" && pwd -P)
            if [ "${RESOLVED_DEPENDENCY_CACHE_PATH}" != "${SAFE_HOME_CACHE_PATH}" ]; then
              echo "Expected home dependency cache path export to be canonical"
              exit 1
            fi

            rm -f "${TEMP_DIR}/cache-link"
            ln -s "${TEMP_DIR}/dependency-cache" "${TEMP_DIR}/cache-link"
            bash src/scripts/write-node-version-cache-metadata.sh
            CURRENT_PKG_MANAGER=npm bash src/scripts/write-pkg-manager-cache-metadata.sh
            : > "${BASH_ENV_FILE}"
            env BASH_ENV="${BASH_ENV_FILE}" PARAM_ENUM_CACHE_PATH_MODE=initialize PARAM_STR_CACHE_PATH="${TEMP_DIR}/cache-link" \
              bash src/scripts/resolve-dependency-cache-path.sh
            source "${BASH_ENV_FILE}"
            rm "${TEMP_DIR}/cache-link"
            ln -s "${TEMP_DIR}/other-cache" "${TEMP_DIR}/cache-link"
            assert_status 1 "Dependency cache path changed after cache restoration" \
              env RESOLVED_DEPENDENCY_CACHE_PATH="${RESOLVED_DEPENDENCY_CACHE_PATH}" PARAM_ENUM_CACHE_PATH_MODE=verify PARAM_STR_CACHE_PATH="${TEMP_DIR}/cache-link" \
              bash src/scripts/resolve-dependency-cache-path.sh

            bash src/scripts/write-node-version-cache-metadata.sh
            CURRENT_PKG_MANAGER=npm bash src/scripts/write-pkg-manager-cache-metadata.sh
            : > "${BASH_ENV_FILE}"
            env BASH_ENV="${BASH_ENV_FILE}" PARAM_ENUM_CACHE_PATH_MODE=initialize PARAM_STR_CACHE_PATH="${TEMP_DIR}/other-cache" \
              bash src/scripts/resolve-dependency-cache-path.sh
            source "${BASH_ENV_FILE}"
            if ! grep -Fqx "cache-path=${RESOLVED_DEPENDENCY_CACHE_PATH}" /tmp/node-cache-metadata; then
              echo "Expected new initialization to replace prior cache metadata"
              exit 1
            fi
            rm -rf "${HOME}/cache-path-alias" "${HOME}/.cache/pipeline-core-orb-negative-path-cache"

            assert_status 1 "Package manager 'yarn' is not supported" \
              env PARAM_STR_PKG_MANAGER=yarn BASH_ENV="${TEMP_DIR}/bash_env" \
              bash src/scripts/export-pkg-manager.sh

            assert_status 1 "Package manager 'missing-pkg-manager-for-negative-test' is not available" \
              env CURRENT_PKG_MANAGER=missing-pkg-manager-for-negative-test \
              bash src/scripts/validate-pkg-manager.sh

            assert_status 1 "Cannot write package manager cache metadata because pnpm version lookup failed" \
              bash -c 'pnpm() { return 1; }; CURRENT_PKG_MANAGER=pnpm source "$1"' _ \
              "${PWD}/src/scripts/write-pkg-manager-cache-metadata.sh"

            assert_status 1 "Cannot parse package manager version: version 10" \
              bash -c 'pnpm() { printf "version 10\n"; }; CURRENT_PKG_MANAGER=pnpm source "$1"' _ \
              "${PWD}/src/scripts/write-pkg-manager-cache-metadata.sh"

            assert_status 1 "File package.json not found" \
              bash -c 'cd "$1" && bash "$2"' _ \
              "${TEMP_DIR}/missing-package-json" \
              "${PWD}/src/scripts/check-pkg-json.sh"

            assert_status 1 "The lockfile not found!" \
              bash -c 'cd "$1" && CURRENT_PKG_MANAGER=npm bash "$2"' _ \
              "${TEMP_DIR}/missing-lockfile" \
              "${PWD}/src/scripts/process-lockfile.sh"

            assert_status 1 "At least Node.js v18.20 is required!" \
              bash -c 'node() { printf "v18.19.0\n"; }; source "$1"' _ \
              "${PWD}/src/scripts/check-node-version.sh"

            assert_status 1 "Unable to parse Node.js version: version 20" \
              bash -c 'node() { printf "version 20\n"; }; source "$1"' _ \
              "${PWD}/src/scripts/check-node-version.sh"

            assert_status 42 "Running package.json script 'fail'" \
              bash -c 'cd "$1" && CURRENT_PKG_MANAGER=npm PARAM_STR_SCRIPT=fail PARAM_STR_SCRIPT_ARGS= PARAM_STR_RUN_OPTIONS= bash "$2"' _ \
              "${TEMP_DIR}/failing-script" \
              "${PWD}/src/scripts/run-script.sh"

            assert_status 1 "Dependency cache path was not resolved" \
              env -u RESOLVED_DEPENDENCY_CACHE_PATH CURRENT_PKG_MANAGER=npm PARAM_STR_INSTALL_COMMAND='exit 43' \
              bash src/scripts/install-dependencies.sh

            assert_status 43 "Running custom install command" \
              env CURRENT_PKG_MANAGER=npm RESOLVED_DEPENDENCY_CACHE_PATH="${TEMP_DIR}/dependency-cache" PARAM_STR_INSTALL_COMMAND='exit 43' \
              bash src/scripts/install-dependencies.sh

            assert_status 1 "Running custom install command" \
              env CURRENT_PKG_MANAGER=npm RESOLVED_DEPENDENCY_CACHE_PATH="${TEMP_DIR}/dependency-cache" PARAM_STR_INSTALL_COMMAND='false | true' \
              bash src/scripts/install-dependencies.sh
