version: 2.1

orbs:
  orb-tools: circleci/orb-tools@12.0
  node: circleci/node@7.1.0
  core: {}

filters: &filters
  tags:
    only: /.*/

release-filters: &release-filters
  branches:
    ignore: /.*/
  tags:
    only: /^v[0-9]+\.[0-9]+\.[0-9]+$/

jobs:
  ensure-npm-version:
    executor: core/node
    steps:
      - core/ensure_pkg_manager:
          pkg_manager: npm@10.5.1
      - run:
          name: Validate version
          command: |
            if [ "$(npm --version)" != "10.5.1" ]; then
              echo "npm version 10.5.1 not found"
              exit 1
            fi
  ensure-npm-latest-compatibility:
    executor: core/node
    steps:
      - core/ensure_pkg_manager:
          pkg_manager: npm@latest
      - run:
          name: Validate latest version compatibility
          command: |
            NPM_LATEST_VERSION=$(npm view npm version)
            if ! npm --version | grep -q "$NPM_LATEST_VERSION"; then
              echo "npm version $NPM_LATEST_VERSION not found"
              exit 1
            fi
  ensure-pnpm-version:
    executor: core/node_secrets
    steps:
      - core/ensure_pkg_manager:
          pkg_manager: pnpm@10.5.1
      - run:
          name: Validate version
          command: |
            if [ "$(pnpm --version)" != "10.5.1" ]; then
              echo "pnpm version 10.5.1 not found"
              exit 1
            fi
  ensure-pnpm-latest-compatibility:
    executor: core/node_secrets
    steps:
      - core/ensure_pkg_manager:
          pkg_manager: pnpm@latest
      - run:
          name: Validate latest version compatibility
          command: |
            PNPM_LATEST_VERSION=$(npm view pnpm version)
            if ! pnpm --version | grep -q "$PNPM_LATEST_VERSION"; then
              echo "pnpm version $PNPM_LATEST_VERSION not found"
              exit 1
            fi
  ensure-pnpm-fresh-install:
    docker:
      - image: node:lts-slim
    resource_class: medium
    steps:
      - core/ensure_pkg_manager:
          pkg_manager: pnpm
      - run:
          name: Validate version
          command: |
            PNPM_LATEST_VERSION=$(npm view pnpm version)
            if ! pnpm --version | grep -q "$PNPM_LATEST_VERSION"; then
              echo "pnpm version $PNPM_LATEST_VERSION not found"
              exit 1
            fi
  ensure-pnpm-removes-existing-installation:
    executor: core/node
    steps:
      - run:
          name: Prepare standalone pnpm path shadow
          command: |
            export PNPM_HOME="${HOME}/.pnpm-home-shadow"
            mkdir -p "${PNPM_HOME}" "${HOME}/.pnpm-store-shadow"
            printf 'store sentinel\n' > "${HOME}/.pnpm-store-shadow/sentinel"
            {
              printf '%s\n' '#!/bin/sh'
              printf '%s\n' 'if [ "$1" = "--version" ]; then'
              printf '%s\n' "  printf '9.0.0\\n'"
              printf '%s\n' '  exit 0'
              printf '%s\n' 'fi'
              printf '%s\n' 'if [ "$1" = "store" ] && [ "$2" = "path" ]; then'
              printf '%s\n' '  printf "%s\\n" "${HOME}/.pnpm-store-shadow"'
              printf '%s\n' '  exit 0'
              printf '%s\n' 'fi'
              printf '%s\n' 'printf "Unexpected standalone pnpm invocation: %s\\n" "$*" >&2'
              printf '%s\n' 'exit 1'
            } > "${PNPM_HOME}/pnpm"
            chmod +x "${PNPM_HOME}/pnpm"
            {
              printf 'export PNPM_HOME=%q\n' "${PNPM_HOME}"
              printf 'export PATH=%q:"$PATH"\n' "${PNPM_HOME}"
            } >> "${BASH_ENV}"
      - core/ensure_pkg_manager:
          pkg_manager: pnpm@10.5.1
      - run:
          name: Validate pnpm replacement removes existing installation
          command: |
            EXPECTED_PNPM="$(npm prefix -g)/bin/pnpm"
            if [ "$(command -v pnpm)" != "${EXPECTED_PNPM}" ]; then
              echo "Expected npm-installed pnpm to take precedence"
              echo "Expected: ${EXPECTED_PNPM}"
              echo "Actual: $(command -v pnpm)"
              exit 1
            fi
            if [ "$(pnpm --version)" != "10.5.1" ]; then
              echo "Expected npm-installed pnpm version 10.5.1"
              exit 1
            fi
            if [ -e "${PNPM_HOME}" ]; then
              echo "Expected existing PNPM_HOME to be removed"
              exit 1
            fi
            if [ -e "${HOME}/.pnpm-store-shadow" ]; then
              echo "Expected existing pnpm store to be removed"
              exit 1
            fi
  ensure-pnpm-machine-install:
    machine:
      image: ubuntu-2404:current
    steps:
      - node/install
      - core/ensure_pkg_manager:
          pkg_manager: pnpm
      - run:
          name: Validate version
          command: |
            PNPM_LATEST_VERSION=$(npm view pnpm version)
            if ! pnpm --version | grep -q "$PNPM_LATEST_VERSION"; then
              echo "pnpm version $PNPM_LATEST_VERSION not found"
              exit 1
            fi
  ensure-default-pkg-manager-env:
    executor: core/node
    environment:
      DEFAULT_PKG_MANAGER: pnpm@10.5.1
    steps:
      - core/ensure_pkg_manager
      - run:
          name: Validate version and metadata ownership
          command: |
            if [ "$(pnpm --version)" != "10.5.1" ]; then
              echo "pnpm version 10.5.1 not found"
              exit 1
            fi
            if [ -e /tmp/node-cache-metadata ]; then
              echo "ensure_pkg_manager should not create dependency cache metadata"
              exit 1
            fi

  install-dependencies-npm-node-22:
    executor:
      name: core/node_secrets
      tag: "22"
    steps:
      - checkout
      - core/ensure_pkg_manager:
          pkg_manager: npm
      - core/install_dependencies:
          pkg_manager: npm
          pkg_json_dir: ~/project/sample
          cache_version: node22_v2
          cache_path: ~/project/.orb-npm-cache
      - run:
          name: Validate npm direct dependency cache
          command: |
            NPM_CACHE_DIR="$HOME/project/.orb-npm-cache"
            if [ ! -d "$NPM_CACHE_DIR/_cacache" ]; then
              echo "Expected npm direct dependency cache to be populated"
              exit 1
            fi
            if [ -e /tmp/node-cache-metadata ] || [ -e /tmp/node-lockfile ]; then
              echo "Expected temporary dependency cache files to be removed"
              exit 1
            fi
      - run: cd ~/project/sample && npm run build
  install-dependencies-npm-warm-cache-seed:
    executor:
      name: core/node_secrets
      tag: "22"
    steps:
      - checkout
      - core/ensure_pkg_manager:
          pkg_manager: npm
      - core/install_dependencies:
          pkg_manager: npm
          pkg_json_dir: ~/project/sample
          cache_version: warm-cache-v1-<< pipeline.number >>
          cache_path: ~/project/.orb-npm-warm-cache
          install_command: |
            npm ci
            printf '%s\n' '<< pipeline.id >>' > "${npm_config_cache}/.orb-warm-cache-sentinel"
      - run:
          name: Validate warm-cache seed sentinel
          command: |
            SENTINEL_PATH="$HOME/project/.orb-npm-warm-cache/.orb-warm-cache-sentinel"
            if [ ! -f "${SENTINEL_PATH}" ] || [ "$(cat "${SENTINEL_PATH}")" != "<< pipeline.id >>" ]; then
              echo "Expected the npm warm-cache seed sentinel for this pipeline"
              exit 1
            fi
  install-dependencies-npm-warm-cache-restore:
    executor:
      name: core/node_secrets
      tag: "22"
    steps:
      - checkout
      - run:
          name: Clear npm warm-cache restore inputs
          command: |
            rm -rf ~/project/.orb-npm-warm-cache ~/project/sample/node_modules
            if [ -e ~/project/.orb-npm-warm-cache/.orb-warm-cache-sentinel ]; then
              echo "Expected the npm warm cache to be absent before restoration"
              exit 1
            fi
      - core/ensure_pkg_manager:
          pkg_manager: npm
      - core/install_dependencies:
          pkg_manager: npm
          pkg_json_dir: ~/project/sample
          cache_version: warm-cache-v1-<< pipeline.number >>
          cache_path: ~/project/.orb-npm-warm-cache
          install_command: npm ci --offline
      - run:
          name: Validate restored npm warm cache
          command: |
            SENTINEL_PATH="$HOME/project/.orb-npm-warm-cache/.orb-warm-cache-sentinel"
            if [ ! -f "${SENTINEL_PATH}" ] || [ "$(cat "${SENTINEL_PATH}")" != "<< pipeline.id >>" ]; then
              echo "Expected the npm warm cache restored from this pipeline's seed job"
              exit 1
            fi
      - run: cd ~/project/sample && npm run build
  install-dependencies-pnpm-node-22:
    executor:
      name: core/node
      tag: "22.15"
    steps:
      - checkout
      - core/ensure_pkg_manager:
          pkg_manager: pnpm@10.5.1
      - core/install_dependencies:
          pkg_manager: pnpm
          pkg_json_dir: ~/project/sample
          cache_version: node22_v2
          cache_path: ~/project/.orb-pnpm-store
      - run:
          name: Validate pnpm direct dependency cache
          command: |
            PNPM_STORE_DIR="$HOME/project/.orb-pnpm-store/v$(pnpm --version | cut -d. -f1)"
            if [ ! -d "$PNPM_STORE_DIR" ]; then
              echo "Expected pnpm direct dependency cache to be populated"
              exit 1
            fi
            if [ -e /tmp/node-cache-metadata ] || [ -e /tmp/node-lockfile ]; then
              echo "Expected temporary dependency cache files to be removed"
              exit 1
            fi
      - run: cd ~/project/sample && pnpm run build
  install-dependencies-npm-node-24:
    executor:
      name: core/node_secrets
      tag: "24"
    steps:
      - checkout
      - core/ensure_pkg_manager:
          pkg_manager: npm
      - core/install_dependencies:
          pkg_manager: npm
          pkg_json_dir: ~/project/sample
          cache_version: node24_v4
          cache_path: ~/project/.orb-npm-cache
      - run:
          name: Validate npm direct dependency cache
          command: |
            NPM_CACHE_DIR="$HOME/project/.orb-npm-cache"
            if [ ! -d "$NPM_CACHE_DIR/_cacache" ]; then
              echo "Expected npm direct dependency cache to be populated"
              exit 1
            fi
            if [ -e /tmp/node-cache-metadata ] || [ -e /tmp/node-lockfile ]; then
              echo "Expected temporary dependency cache files to be removed"
              exit 1
            fi
      - run: cd ~/project/sample && npm run build
  install-dependencies-pnpm-node-24:
    executor:
      name: core/node
      tag: "24.11"
    steps:
      - checkout
      - core/ensure_pkg_manager:
          pkg_manager: pnpm@10.5.1
      - core/install_dependencies:
          pkg_manager: pnpm
          pkg_json_dir: ~/project/sample
          cache_version: node24_v4
          cache_path: ~/project/.orb-pnpm-store
      - run:
          name: Validate pnpm direct dependency cache
          command: |
            PNPM_STORE_DIR="$HOME/project/.orb-pnpm-store/v$(pnpm --version | cut -d. -f1)"
            if [ ! -d "$PNPM_STORE_DIR" ]; then
              echo "Expected pnpm direct dependency cache to be populated"
              exit 1
            fi
            if [ -e /tmp/node-cache-metadata ] || [ -e /tmp/node-lockfile ]; then
              echo "Expected temporary dependency cache files to be removed"
              exit 1
            fi
      - run: cd ~/project/sample && pnpm run build
  install-dependencies-custom-command:
    executor: core/node
    steps:
      - checkout
      - core/ensure_pkg_manager:
          pkg_manager: pnpm@10.5.1
      - core/install_dependencies:
          pkg_manager: pnpm
          pkg_json_dir: ~/project/sample
          install_command: pnpm install | tee /tmp/pnpm-custom-install.log
          cache_version: v10
      - run:
          name: Validate custom install command output
          command: |
            if [ ! -s /tmp/pnpm-custom-install.log ]; then
              echo "Expected custom install pipeline output to be captured"
              exit 1
            fi
      - run: cd ~/project/sample && pnpm run build
  install-dependencies-default-pkg-manager-env:
    executor: core/node
    environment:
      DEFAULT_PKG_MANAGER: pnpm@10.5.1
    steps:
      - checkout
      - core/ensure_pkg_manager
      - core/install_dependencies:
          pkg_json_dir: ~/project/sample
          cache_version: default_env_v1
      - run:
          name: Validate default package manager direct dependency cache
          command: |
            PNPM_STORE_DIR="$HOME/.cache/pipeline-core-orb/dependency-cache/v$(pnpm --version | cut -d. -f1)"
            if [ ! -d "$PNPM_STORE_DIR" ]; then
              echo "Expected pnpm direct dependency cache to be populated"
              exit 1
            fi
            if [ -e /tmp/node-cache-metadata ] || [ -e /tmp/node-lockfile ]; then
              echo "Expected temporary dependency cache files to be removed"
              exit 1
            fi
      - run: cd ~/project/sample && pnpm run build
  install-dependencies-preinstalled-npm:
    executor: core/node
    steps:
      - checkout
      - core/install_dependencies:
          pkg_manager: npm
          pkg_json_dir: ~/project/sample
          cache_version: external_preinstalled_npm_v1
      - run: cd ~/project/sample && npm run build
  install-dependencies-externally-installed-pnpm:
    executor: core/node
    steps:
      - checkout
      - run:
          name: Install pnpm externally
          command: sudo npm install -g pnpm@10.5.1
      - core/install_dependencies:
          pkg_manager: pnpm
          pkg_json_dir: ~/project/sample
          cache_version: external_installed_pnpm_v1
      - run: cd ~/project/sample && pnpm run build

  run-script-npm:
    executor: core/node
    steps:
      - checkout
      - core/ensure_pkg_manager:
          pkg_manager: npm
      - core/install_dependencies:
          pkg_manager: npm
          pkg_json_dir: ~/project/sample
      - core/run_script:
          pkg_manager: npm
          pkg_json_dir: ~/project/sample
          script: test
          script_args: --json --outputFile=results_npm.json
      - run:
          name: Print output file
          working_directory: ~/project/sample
          command: cat results_npm.json
  run-script-pnpm:
    executor: core/node
    steps:
      - checkout
      - core/ensure_pkg_manager:
          pkg_manager: pnpm@10.5.1
      - core/install_dependencies:
          pkg_manager: pnpm
          pkg_json_dir: ~/project/sample
      - core/run_script:
          pkg_manager: pnpm
          pkg_json_dir: ~/project/sample
          script: test
          script_args: --json --outputFile=results_pnpm.json
      - run:
          name: Print output file
          working_directory: ~/project/sample
          command: cat results_pnpm.json
  run-script-pnpm-latest-10-compatibility:
    executor: core/node
    steps:
      - checkout
      - core/ensure_pkg_manager:
          pkg_manager: pnpm@latest-10
      - core/install_dependencies:
          pkg_manager: pnpm
          pkg_json_dir: ~/project/sample
      - core/run_script:
          pkg_manager: pnpm
          pkg_json_dir: ~/project/sample
          script: test
          script_args: --json --outputFile=results_pnpm_latest_10.json
      - run:
          name: Print output file
          working_directory: ~/project/sample
          command: cat results_pnpm_latest_10.json
  run-script-default-pkg-manager-env:
    executor: core/node
    environment:
      DEFAULT_PKG_MANAGER: pnpm@10.5.1
    steps:
      - checkout
      - core/ensure_pkg_manager
      - core/install_dependencies:
          pkg_json_dir: ~/project/sample
      - core/run_script:
          pkg_json_dir: ~/project/sample
          script: test
          script_args: --json --outputFile=results_pnpm_default.json
      - run:
          name: Validate run_script metadata ownership
          command: |
            if [ -e /tmp/node-cache-metadata ]; then
              echo "run_script should not create dependency cache metadata"
              exit 1
            fi
      - run:
          name: Print output file
          working_directory: ~/project/sample
          command: cat results_pnpm_default.json
  run-script-externally-prepared-pnpm:
    executor: core/node
    steps:
      - checkout
      - run:
          name: Install pnpm externally
          command: sudo npm install -g pnpm@10.5.1
      - run:
          name: Install dependencies externally
          command: pnpm install --frozen-lockfile
          working_directory: ~/project/sample
      - core/run_script:
          pkg_manager: pnpm
          pkg_json_dir: ~/project/sample
          script: test
          script_args: --json --outputFile=results_external_pnpm.json
      - run:
          name: Print output file
          working_directory: ~/project/sample
          command: cat results_external_pnpm.json
  run-script-npm-workspace:
    executor: core/node
    steps:
      - checkout
      - core/run_script:
          pkg_manager: npm
          pkg_json_dir: ~/project/sample/workspace
          script: workspace-test
          script_args: workspace-result-npm.txt npm workspace
          run_options: --workspace=workspace-app
      - run:
          name: Validate npm workspace script output
          working_directory: ~/project/sample/workspace/packages/app
          command: |
            if [ "$(cat workspace-result-npm.txt)" != "npm|workspace" ]; then
              echo "Unexpected npm workspace script output"
              exit 1
            fi
      - run:
          name: Clean npm workspace script output
          working_directory: ~/project/sample/workspace/packages/app
          command: rm -f workspace-result-npm.txt
  run-script-pnpm-workspace:
    executor: core/node
    steps:
      - checkout
      - core/ensure_pkg_manager:
          pkg_manager: pnpm@10.5.1
      - core/run_script:
          pkg_manager: pnpm
          pkg_json_dir: ~/project/sample/workspace
          script: workspace-test
          script_args: workspace-result-pnpm.txt pnpm workspace
          run_options: --filter=workspace-app
      - run:
          name: Validate pnpm workspace script output
          working_directory: ~/project/sample/workspace/packages/app
          command: |
            if [ "$(cat workspace-result-pnpm.txt)" != "pnpm|workspace" ]; then
              echo "Unexpected pnpm workspace script output"
              exit 1
            fi
      - run:
          name: Clean pnpm workspace script output
          working_directory: ~/project/sample/workspace/packages/app
          command: rm -f workspace-result-pnpm.txt
  install-infisical:
    executor: core/ubuntu
    steps:
      - core/install_infisical
      - run:
          name: Validate Infisical CLI installation
          command: |
            if ! infisical --version | grep -Eq 'v?[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "Infisical CLI did not report a semantic version"
              exit 1
            fi
      - core/install_infisical:
          version: v0.43.119
      - run:
          name: Validate pinned Infisical CLI installation
          command: |
            if ! infisical --version | grep -Eq 'v?0\.43\.119'; then
              echo "Infisical CLI version 0.43.119 not found"
              infisical --version
              exit 1
            fi
  cache-contract-validation:
    executor: core/node
    steps:
      - checkout
      - run:
          name: Validate dependency cache contract
          command: bash .circleci/tests/cache-contract-validation.sh
  negative-path-validation:
    executor: core/node
    steps:
      - checkout
      - run:
          name: Validate expected failure paths
          command: bash .circleci/tests/negative-path-validation.sh
workflows:
  test-deploy:
    jobs:
      - ensure-npm-version:
          filters: *filters
      - ensure-npm-latest-compatibility:
          filters: *filters
      - ensure-pnpm-version:
          filters: *filters
      - ensure-pnpm-latest-compatibility:
          filters: *filters
      - ensure-pnpm-fresh-install:
          filters: *filters
      - ensure-pnpm-removes-existing-installation:
          filters: *filters
      - ensure-pnpm-machine-install:
          filters: *filters
      - ensure-default-pkg-manager-env:
          filters: *filters
      - install-dependencies-npm-node-22:
          filters: *filters
      - install-dependencies-npm-warm-cache-seed:
          filters: *filters
      - install-dependencies-npm-warm-cache-restore:
          requires:
            - install-dependencies-npm-warm-cache-seed
          filters: *filters
      - install-dependencies-pnpm-node-22:
          filters: *filters
      - install-dependencies-npm-node-24:
          filters: *filters
      - install-dependencies-pnpm-node-24:
          filters: *filters
      - install-dependencies-custom-command:
          filters: *filters
      - install-dependencies-default-pkg-manager-env:
          filters: *filters
      - install-dependencies-preinstalled-npm:
          filters: *filters
      - install-dependencies-externally-installed-pnpm:
          filters: *filters
      - run-script-npm:
          filters: *filters
      - run-script-pnpm:
          filters: *filters
      - run-script-pnpm-latest-10-compatibility:
          filters: *filters
      - run-script-default-pkg-manager-env:
          filters: *filters
      - run-script-externally-prepared-pnpm:
          filters: *filters
      - run-script-npm-workspace:
          filters: *filters
      - run-script-pnpm-workspace:
          filters: *filters
      - install-infisical:
          filters: *filters
      - cache-contract-validation:
          filters: *filters
      - negative-path-validation:
          filters: *filters
      - core/install_and_run:
          name: install-and-run-npm
          pkg_manager: npm
          pkg_json_dir: ~/project/sample
          script: test
          script_args: --json --outputFile=results_install_and_run_npm.json
          filters: *filters
      - core/install_and_run:
          name: install-and-run-pnpm-with-hooks
          pkg_manager: pnpm
          pkg_json_dir: ~/project/sample
          script: test
          script_args: --json --outputFile=results_install_and_run_pnpm_hooks.json
          pre_install_steps:
            - run:
                name: Validate pre-install hook placement
                command: |
                  if ! command -v pnpm >/dev/null 2>&1; then
                    echo "Expected pnpm to be available before dependency installation"
                    exit 1
                  fi
                  if [ -d ~/project/sample/node_modules ]; then
                    echo "Expected dependencies not to be installed before pre-install steps"
                    exit 1
                  fi
                  echo "pre-install" > /tmp/install-and-run-hook-order
          post_install_steps:
            - run:
                name: Validate post-install hook placement
                command: |
                  if [ ! -d ~/project/sample/node_modules ]; then
                    echo "Expected dependencies to be installed before post-install steps"
                    exit 1
                  fi
                  if [ "$(cat /tmp/install-and-run-hook-order)" != "pre-install" ]; then
                    echo "Expected pre-install hook to run before post-install hook"
                    exit 1
                  fi
                  rm -f /tmp/install-and-run-hook-order
          filters: *filters
      - orb-tools/pack:
          filters: *release-filters
      - orb-tools/publish:
          orb_name: studion/core
          vcs_type: << pipeline.project.type >>
          pub_type: production
          requires:
            - orb-tools/pack
            - ensure-npm-version
            - ensure-npm-latest-compatibility
            - ensure-pnpm-version
            - ensure-pnpm-latest-compatibility
            - ensure-pnpm-fresh-install
            - ensure-pnpm-removes-existing-installation
            - ensure-pnpm-machine-install
            - ensure-default-pkg-manager-env
            - install-dependencies-npm-node-22
            - install-dependencies-npm-warm-cache-restore
            - install-dependencies-pnpm-node-22
            - install-dependencies-npm-node-24
            - install-dependencies-pnpm-node-24
            - install-dependencies-custom-command
            - install-dependencies-default-pkg-manager-env
            - install-dependencies-preinstalled-npm
            - install-dependencies-externally-installed-pnpm
            - run-script-npm
            - run-script-pnpm
            - run-script-pnpm-latest-10-compatibility
            - run-script-default-pkg-manager-env
            - run-script-externally-prepared-pnpm
            - run-script-npm-workspace
            - run-script-pnpm-workspace
            - install-infisical
            - cache-contract-validation
            - negative-path-validation
            - install-and-run-npm
            - install-and-run-pnpm-with-hooks
          context: orb-publishing
          filters: *release-filters
