version: 2.1

orbs:
  orb-tools: circleci/orb-tools@12.0
  node: circleci/node@7.1.0
  core: {}

filters: &filters
  tags:
    only: /.*/

release-filters: &release-filters
  branches:
    ignore: /.*/
  tags:
    only: /^v[0-9]+\.[0-9]+\.[0-9]+$/

jobs:
  ensure-npm-version:
    executor: core/node
    steps:
      - core/ensure_pkg_manager:
          pkg_manager: npm@10.5.1
      - run:
          name: Validate version
          command: |
            if [ "$(npm --version)" != "10.5.1" ]; then
              echo "npm version 10.5.1 not found"
              exit 1
            fi
  ensure-npm-latest-compatibility:
    executor: core/node
    steps:
      - core/ensure_pkg_manager:
          pkg_manager: npm@latest
      - run:
          name: Validate latest version compatibility
          command: |
            NPM_LATEST_VERSION=$(npm view npm version)
            if ! npm --version | grep -q "$NPM_LATEST_VERSION"; then
              echo "npm version $NPM_LATEST_VERSION not found"
              exit 1
            fi
  ensure-pnpm-version:
    executor: core/node_secrets
    steps:
      - core/ensure_pkg_manager:
          pkg_manager: pnpm@10.5.1
      - run:
          name: Validate version
          command: |
            if [ "$(pnpm --version)" != "10.5.1" ]; then
              echo "pnpm version 10.5.1 not found"
              exit 1
            fi
  ensure-pnpm-latest-compatibility:
    executor: core/node_secrets
    steps:
      - core/ensure_pkg_manager:
          pkg_manager: pnpm@latest
      - run:
          name: Validate latest version compatibility
          command: |
            PNPM_LATEST_VERSION=$(npm view pnpm version)
            if ! pnpm --version | grep -q "$PNPM_LATEST_VERSION"; then
              echo "pnpm version $PNPM_LATEST_VERSION not found"
              exit 1
            fi
  ensure-pnpm-fresh-install:
    docker:
      - image: node:lts-slim
    resource_class: medium
    steps:
      - core/ensure_pkg_manager:
          pkg_manager: pnpm
      - run:
          name: Validate version
          command: |
            PNPM_LATEST_VERSION=$(npm view pnpm version)
            if ! pnpm --version | grep -q "$PNPM_LATEST_VERSION"; then
              echo "pnpm version $PNPM_LATEST_VERSION not found"
              exit 1
            fi
  ensure-pnpm-machine-install:
    machine:
      image: ubuntu-2404:current
    steps:
      - node/install
      - core/ensure_pkg_manager:
          pkg_manager: pnpm
      - run:
          name: Validate version
          command: |
            PNPM_LATEST_VERSION=$(npm view pnpm version)
            if ! pnpm --version | grep -q "$PNPM_LATEST_VERSION"; then
              echo "pnpm version $PNPM_LATEST_VERSION not found"
              exit 1
            fi
  ensure-default-pkg-manager-env:
    executor: core/node
    environment:
      DEFAULT_PKG_MANAGER: pnpm@10.5.1
    steps:
      - core/ensure_pkg_manager
      - run:
          name: Validate version and metadata ownership
          command: |
            if [ "$(pnpm --version)" != "10.5.1" ]; then
              echo "pnpm version 10.5.1 not found"
              exit 1
            fi
            if [ -f /tmp/node-pkg-manager ]; then
              echo "ensure_pkg_manager should not create package manager cache metadata"
              exit 1
            fi
            if [ -f /tmp/node-version ]; then
              echo "ensure_pkg_manager should not create Node.js version cache metadata"
              exit 1
            fi

  install-dependencies-npm-node-18:
    executor:
      name: core/node_secrets
      tag: "18"
    steps:
      - checkout
      - core/ensure_pkg_manager:
          pkg_manager: npm
      - core/install_dependencies:
          pkg_manager: npm
          pkg_json_dir: ~/project/sample
          cache_version: node18_v7
      - run:
          name: Validate npm dependency cache cleanup
          command: |
            if [ -d "$HOME/.cache/pipeline-core-orb/dependency-cache" ]; then
              echo "Expected dependency cache staging root to be removed"
              exit 1
            fi
            NPM_CACHE_DIR=$(npm config get cache)
            if [ ! -d "$NPM_CACHE_DIR" ]; then
              echo "Expected npm cache directory to remain after staging cleanup"
              exit 1
            fi
            if [ -f /tmp/node-pkg-manager ]; then
              echo "Expected package manager cache metadata to be removed"
              exit 1
            fi
            if [ -f /tmp/node-version ]; then
              echo "Expected Node.js version cache metadata to be removed"
              exit 1
            fi
      - run: cd ~/project/sample && npm run build
  install-dependencies-pnpm-node-18:
    executor:
      name: core/node
      tag: "18.20"
    steps:
      - checkout
      - core/ensure_pkg_manager:
          pkg_manager: pnpm@10.5.1
      - core/install_dependencies:
          pkg_manager: pnpm
          pkg_json_dir: ~/project/sample
          cache_version: node18_v7
      - run:
          name: Validate pnpm dependency cache cleanup
          command: |
            if [ -d "$HOME/.cache/pipeline-core-orb/dependency-cache" ]; then
              echo "Expected dependency cache staging root to be removed"
              exit 1
            fi
            PNPM_STORE_DIR=$(pnpm store path)
            if [ ! -d "$PNPM_STORE_DIR" ]; then
              echo "Expected pnpm store directory to remain after staging cleanup"
              exit 1
            fi
            if [ -f /tmp/node-pkg-manager ]; then
              echo "Expected package manager cache metadata to be removed"
              exit 1
            fi
            if [ -f /tmp/node-version ]; then
              echo "Expected Node.js version cache metadata to be removed"
              exit 1
            fi
      - run: cd ~/project/sample && pnpm run build
  install-dependencies-custom-command:
    executor: core/node
    steps:
      - checkout
      - core/ensure_pkg_manager:
          pkg_manager: pnpm@10.5.1
      - core/install_dependencies:
          pkg_manager: pnpm
          pkg_json_dir: ~/project/sample
          install_command: pnpm install | tee /tmp/pnpm-custom-install.log
          cache_version: v10
      - run:
          name: Validate custom install command output
          command: |
            if [ ! -s /tmp/pnpm-custom-install.log ]; then
              echo "Expected custom install pipeline output to be captured"
              exit 1
            fi
      - run: cd ~/project/sample && pnpm run build
  install-dependencies-default-pkg-manager-env:
    executor: core/node
    environment:
      DEFAULT_PKG_MANAGER: pnpm@10.5.1
    steps:
      - checkout
      - core/ensure_pkg_manager
      - core/install_dependencies:
          pkg_json_dir: ~/project/sample
          cache_version: default_env_v1
      - run:
          name: Validate default package manager dependency cache cleanup
          command: |
            if [ -d "$HOME/.cache/pipeline-core-orb/dependency-cache" ]; then
              echo "Expected dependency cache staging root to be removed"
              exit 1
            fi
            PNPM_STORE_DIR=$(pnpm store path)
            if [ ! -d "$PNPM_STORE_DIR" ]; then
              echo "Expected pnpm store directory to remain after staging cleanup"
              exit 1
            fi
            if [ -f /tmp/node-pkg-manager ]; then
              echo "Expected package manager cache metadata to be removed"
              exit 1
            fi
            if [ -f /tmp/node-version ]; then
              echo "Expected Node.js version cache metadata to be removed"
              exit 1
            fi
      - run: cd ~/project/sample && pnpm run build
  install-dependencies-preinstalled-npm:
    executor: core/node
    steps:
      - checkout
      - core/install_dependencies:
          pkg_manager: npm
          pkg_json_dir: ~/project/sample
          cache_version: external_preinstalled_npm_v1
      - run: cd ~/project/sample && npm run build
  install-dependencies-externally-installed-pnpm:
    executor: core/node
    steps:
      - checkout
      - run:
          name: Install pnpm externally
          command: sudo npm install -g pnpm@10.5.1
      - core/install_dependencies:
          pkg_manager: pnpm
          pkg_json_dir: ~/project/sample
          cache_version: external_installed_pnpm_v1
      - run: cd ~/project/sample && pnpm run build

  run-script-npm:
    executor: core/node
    steps:
      - checkout
      - core/ensure_pkg_manager:
          pkg_manager: npm
      - core/install_dependencies:
          pkg_manager: npm
          pkg_json_dir: ~/project/sample
      - core/run_script:
          pkg_manager: npm
          pkg_json_dir: ~/project/sample
          script: test
          script_args: --json --outputFile=results_npm.json
      - run:
          name: Print output file
          working_directory: ~/project/sample
          command: cat results_npm.json
  run-script-pnpm:
    executor: core/node
    steps:
      - checkout
      - core/ensure_pkg_manager:
          pkg_manager: pnpm@10.5.1
      - core/install_dependencies:
          pkg_manager: pnpm
          pkg_json_dir: ~/project/sample
      - core/run_script:
          pkg_manager: pnpm
          pkg_json_dir: ~/project/sample
          script: test
          script_args: --json --outputFile=results_pnpm.json
      - run:
          name: Print output file
          working_directory: ~/project/sample
          command: cat results_pnpm.json
  run-script-pnpm-latest-10-compatibility:
    executor: core/node
    steps:
      - checkout
      - core/ensure_pkg_manager:
          pkg_manager: pnpm@latest-10
      - core/install_dependencies:
          pkg_manager: pnpm
          pkg_json_dir: ~/project/sample
      - core/run_script:
          pkg_manager: pnpm
          pkg_json_dir: ~/project/sample
          script: test
          script_args: --json --outputFile=results_pnpm_latest_10.json
      - run:
          name: Print output file
          working_directory: ~/project/sample
          command: cat results_pnpm_latest_10.json
  run-script-default-pkg-manager-env:
    executor: core/node
    environment:
      DEFAULT_PKG_MANAGER: pnpm@10.5.1
    steps:
      - checkout
      - core/ensure_pkg_manager
      - core/install_dependencies:
          pkg_json_dir: ~/project/sample
      - core/run_script:
          pkg_json_dir: ~/project/sample
          script: test
          script_args: --json --outputFile=results_pnpm_default.json
      - run:
          name: Validate run_script metadata ownership
          command: |
            if [ -f /tmp/node-pkg-manager ]; then
              echo "run_script should not create package manager cache metadata"
              exit 1
            fi
            if [ -f /tmp/node-version ]; then
              echo "run_script should not create Node.js version cache metadata"
              exit 1
            fi
      - run:
          name: Print output file
          working_directory: ~/project/sample
          command: cat results_pnpm_default.json
  run-script-externally-prepared-pnpm:
    executor: core/node
    steps:
      - checkout
      - run:
          name: Install pnpm externally
          command: sudo npm install -g pnpm@10.5.1
      - run:
          name: Install dependencies externally
          command: pnpm install --frozen-lockfile
          working_directory: ~/project/sample
      - core/run_script:
          pkg_manager: pnpm
          pkg_json_dir: ~/project/sample
          script: test
          script_args: --json --outputFile=results_external_pnpm.json
      - run:
          name: Print output file
          working_directory: ~/project/sample
          command: cat results_external_pnpm.json
  run-script-npm-workspace:
    executor: core/node
    steps:
      - checkout
      - core/run_script:
          pkg_manager: npm
          pkg_json_dir: ~/project/sample/workspace
          script: workspace-test
          script_args: workspace-result-npm.txt npm workspace
          run_options: --workspace=workspace-app
      - run:
          name: Validate npm workspace script output
          working_directory: ~/project/sample/workspace/packages/app
          command: |
            if [ "$(cat workspace-result-npm.txt)" != "npm|workspace" ]; then
              echo "Unexpected npm workspace script output"
              exit 1
            fi
      - run:
          name: Clean npm workspace script output
          working_directory: ~/project/sample/workspace/packages/app
          command: rm -f workspace-result-npm.txt
  run-script-pnpm-workspace:
    executor: core/node
    steps:
      - checkout
      - core/ensure_pkg_manager:
          pkg_manager: pnpm@10.5.1
      - core/run_script:
          pkg_manager: pnpm
          pkg_json_dir: ~/project/sample/workspace
          script: workspace-test
          script_args: workspace-result-pnpm.txt pnpm workspace
          run_options: --filter=workspace-app
      - run:
          name: Validate pnpm workspace script output
          working_directory: ~/project/sample/workspace/packages/app
          command: |
            if [ "$(cat workspace-result-pnpm.txt)" != "pnpm|workspace" ]; then
              echo "Unexpected pnpm workspace script output"
              exit 1
            fi
      - run:
          name: Clean pnpm workspace script output
          working_directory: ~/project/sample/workspace/packages/app
          command: rm -f workspace-result-pnpm.txt
  install-infisical:
    executor: core/ubuntu
    steps:
      - core/install_infisical
      - run:
          name: Validate Infisical CLI installation
          command: |
            if ! infisical --version | grep -Eq 'v?[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "Infisical CLI did not report a semantic version"
              exit 1
            fi
      - core/install_infisical:
          version: v0.43.119
      - run:
          name: Validate pinned Infisical CLI installation
          command: |
            if ! infisical --version | grep -Eq 'v?0\.43\.119'; then
              echo "Infisical CLI version 0.43.119 not found"
              infisical --version
              exit 1
            fi
  negative-path-validation:
    executor: core/node
    steps:
      - checkout
      - run:
          name: Validate expected failure paths
          command: |
            assert_status() {
              local expected_status="$1"
              local expected_output="$2"
              local output
              local status

              shift 2

              set +e
              output=$("$@" 2>&1)
              status=$?
              set -e

              if [ "${status}" -ne "${expected_status}" ]; then
                echo "Expected status ${expected_status}, got ${status}: $*"
                echo "Output:"
                printf '%s\n' "${output}"
                exit 1
              fi

              if ! printf '%s\n' "${output}" | grep -Fq "${expected_output}"; then
                echo "Expected output to contain: ${expected_output}"
                echo "Actual output:"
                printf '%s\n' "${output}"
                exit 1
              fi
            }

            TEMP_DIR=$(mktemp -d)
            trap 'rm -rf "${TEMP_DIR}" /tmp/node-lockfile /tmp/node-pkg-manager' EXIT

            mkdir -p "${TEMP_DIR}/missing-package-json"
            mkdir -p "${TEMP_DIR}/missing-lockfile"
            mkdir -p "${TEMP_DIR}/failing-script"

            printf '{"scripts":{}}\n' > "${TEMP_DIR}/missing-lockfile/package.json"
            printf '{"scripts":{"fail":"exit 42"}}\n' > "${TEMP_DIR}/failing-script/package.json"

            assert_status 1 "Package manager 'yarn' is not supported" \
              env PARAM_STR_PKG_MANAGER=yarn BASH_ENV="${TEMP_DIR}/bash_env" \
              bash src/scripts/export-pkg-manager.sh

            assert_status 1 "Package manager 'missing-pkg-manager-for-negative-test' is not available" \
              env CURRENT_PKG_MANAGER=missing-pkg-manager-for-negative-test \
              bash src/scripts/validate-pkg-manager.sh

            assert_status 2 "Refusing to remove unsafe pnpm store path: /" \
              bash -c 'npm() { case "$*" in "root -g") printf "%s\n" "$HOME/.npm-global/lib/node_modules" ;; "dist-tag ls pnpm") printf "latest: 10.5.1\n" ;; "rm -g pnpm") return 0 ;; "i -g pnpm@10.5.1") return 0 ;; *) printf "unexpected npm args: %s\n" "$*" >&2; return 1 ;; esac; }; pnpm() { case "$*" in "--version") printf "9.0.0\n" ;; "store path") printf "/\n" ;; *) return 0 ;; esac; }; sudo() { "$@"; }; CURRENT_PKG_MANAGER=pnpm CURRENT_PKG_MANAGER_VERSION=10.5.1 source "$1"' _ \
              "${PWD}/src/scripts/ensure-pkg-manager.sh"

            assert_status 2 "Refusing to remove PNPM_HOME path without pnpm marker: /usr/local/cache" \
              bash -c 'npm() { case "$*" in "root -g") printf "%s\n" "$HOME/.npm-global/lib/node_modules" ;; "dist-tag ls pnpm") printf "latest: 10.5.1\n" ;; "rm -g pnpm") return 0 ;; "i -g pnpm@10.5.1") return 0 ;; *) printf "unexpected npm args: %s\n" "$*" >&2; return 1 ;; esac; }; pnpm() { case "$*" in "--version") printf "9.0.0\n" ;; "store path") printf "%s\n" "$HOME/.pnpm-store-negative-test" ;; *) return 0 ;; esac; }; sudo() { "$@"; }; PNPM_HOME=/usr/local/cache CURRENT_PKG_MANAGER=pnpm CURRENT_PKG_MANAGER_VERSION=10.5.1 source "$1"' _ \
              "${PWD}/src/scripts/ensure-pkg-manager.sh"

            assert_status 1 "Cannot write package manager cache metadata because pnpm version lookup failed" \
              bash -c 'pnpm() { return 1; }; CURRENT_PKG_MANAGER=pnpm source "$1"' _ \
              "${PWD}/src/scripts/write-pkg-manager-cache-metadata.sh"

            assert_status 1 "Cannot parse package manager version: version 10" \
              bash -c 'pnpm() { printf "version 10\n"; }; CURRENT_PKG_MANAGER=pnpm source "$1"' _ \
              "${PWD}/src/scripts/write-pkg-manager-cache-metadata.sh"

            assert_status 1 "File package.json not found" \
              bash -c 'cd "$1" && bash "$2"' _ \
              "${TEMP_DIR}/missing-package-json" \
              "${PWD}/src/scripts/check-pkg-json.sh"

            assert_status 1 "The lockfile not found!" \
              bash -c 'cd "$1" && CURRENT_PKG_MANAGER=npm bash "$2"' _ \
              "${TEMP_DIR}/missing-lockfile" \
              "${PWD}/src/scripts/process-lockfile.sh"

            assert_status 1 "At least Node.js v18.20 is required!" \
              bash -c 'node() { printf "v18.19.0\n"; }; source "$1"' _ \
              "${PWD}/src/scripts/check-node-version.sh"

            assert_status 1 "Unable to parse Node.js version: version 20" \
              bash -c 'node() { printf "version 20\n"; }; source "$1"' _ \
              "${PWD}/src/scripts/check-node-version.sh"

            assert_status 42 "Running package.json script 'fail'" \
              bash -c 'cd "$1" && CURRENT_PKG_MANAGER=npm PARAM_STR_SCRIPT=fail PARAM_STR_SCRIPT_ARGS= PARAM_STR_RUN_OPTIONS= bash "$2"' _ \
              "${TEMP_DIR}/failing-script" \
              "${PWD}/src/scripts/run-script.sh"

            assert_status 43 "Running custom install command" \
              env CURRENT_PKG_MANAGER=npm PARAM_STR_INSTALL_COMMAND='exit 43' \
              bash src/scripts/install-dependencies.sh

            assert_status 1 "Running custom install command" \
              env CURRENT_PKG_MANAGER=npm PARAM_STR_INSTALL_COMMAND='false | true' \
              bash src/scripts/install-dependencies.sh
workflows:
  test-deploy:
    jobs:
      - ensure-npm-version:
          filters: *filters
      - ensure-npm-latest-compatibility:
          filters: *filters
      - ensure-pnpm-version:
          filters: *filters
      - ensure-pnpm-latest-compatibility:
          filters: *filters
      - ensure-pnpm-fresh-install:
          filters: *filters
      - ensure-pnpm-machine-install:
          filters: *filters
      - ensure-default-pkg-manager-env:
          filters: *filters
      - install-dependencies-npm-node-18:
          filters: *filters
      - install-dependencies-pnpm-node-18:
          filters: *filters
      - install-dependencies-custom-command:
          filters: *filters
      - install-dependencies-default-pkg-manager-env:
          filters: *filters
      - install-dependencies-preinstalled-npm:
          filters: *filters
      - install-dependencies-externally-installed-pnpm:
          filters: *filters
      - run-script-npm:
          filters: *filters
      - run-script-pnpm:
          filters: *filters
      - run-script-pnpm-latest-10-compatibility:
          filters: *filters
      - run-script-default-pkg-manager-env:
          filters: *filters
      - run-script-externally-prepared-pnpm:
          filters: *filters
      - run-script-npm-workspace:
          filters: *filters
      - run-script-pnpm-workspace:
          filters: *filters
      - install-infisical:
          filters: *filters
      - negative-path-validation:
          filters: *filters
      - core/install_and_run:
          name: install-and-run-npm
          pkg_manager: npm
          pkg_json_dir: ~/project/sample
          script: test
          script_args: --json --outputFile=results_install_and_run_npm.json
          filters: *filters
      - core/install_and_run:
          name: install-and-run-pnpm-with-hooks
          pkg_manager: pnpm
          pkg_json_dir: ~/project/sample
          script: test
          script_args: --json --outputFile=results_install_and_run_pnpm_hooks.json
          pre_install_steps:
            - run:
                name: Validate pre-install hook placement
                command: |
                  if ! command -v pnpm >/dev/null 2>&1; then
                    echo "Expected pnpm to be available before dependency installation"
                    exit 1
                  fi
                  if [ -d ~/project/sample/node_modules ]; then
                    echo "Expected dependencies not to be installed before pre-install steps"
                    exit 1
                  fi
                  echo "pre-install" > /tmp/install-and-run-hook-order
          post_install_steps:
            - run:
                name: Validate post-install hook placement
                command: |
                  if [ ! -d ~/project/sample/node_modules ]; then
                    echo "Expected dependencies to be installed before post-install steps"
                    exit 1
                  fi
                  if [ "$(cat /tmp/install-and-run-hook-order)" != "pre-install" ]; then
                    echo "Expected pre-install hook to run before post-install hook"
                    exit 1
                  fi
                  rm -f /tmp/install-and-run-hook-order
          filters: *filters
      - orb-tools/pack:
          filters: *release-filters
      - orb-tools/publish:
          orb_name: studion/core
          vcs_type: << pipeline.project.type >>
          pub_type: production
          requires:
            - orb-tools/pack
            - ensure-npm-version
            - ensure-npm-latest-compatibility
            - ensure-pnpm-version
            - ensure-pnpm-latest-compatibility
            - ensure-pnpm-fresh-install
            - ensure-pnpm-machine-install
            - ensure-default-pkg-manager-env
            - install-dependencies-npm-node-18
            - install-dependencies-pnpm-node-18
            - install-dependencies-custom-command
            - install-dependencies-default-pkg-manager-env
            - install-dependencies-preinstalled-npm
            - install-dependencies-externally-installed-pnpm
            - run-script-npm
            - run-script-pnpm
            - run-script-pnpm-latest-10-compatibility
            - run-script-default-pkg-manager-env
            - run-script-externally-prepared-pnpm
            - run-script-npm-workspace
            - run-script-pnpm-workspace
            - install-infisical
            - negative-path-validation
            - install-and-run-npm
            - install-and-run-pnpm-with-hooks
          context: orb-publishing
          filters: *release-filters
